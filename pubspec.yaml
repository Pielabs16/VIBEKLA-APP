name: vibekla
description: "VibeKLA - Kampala Nightlife Mobile, Web, and Desktop Application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  webview_flutter: ^4.0.0
  go_router: ^14.6.3
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0823"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
